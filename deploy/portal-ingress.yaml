# portal.octodemo.cloud proxies the repository-backed GitHub Pages site at
# https://adibirzu.github.io/obs/. Requests retain their public path and receive
# the repository's /obs prefix before the HTTPS upstream request.
apiVersion: v1
kind: Namespace
metadata:
  name: obs-portal
---
apiVersion: v1
kind: Service
metadata:
  name: ghpages-obs
  namespace: obs-portal
spec:
  type: ExternalName
  externalName: adibirzu.github.io
  ports:
    - name: https
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: obs-portal
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/upstream-vhost: "adibirzu.github.io"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "adibirzu.github.io"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/obs/$2"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["portal.octodemo.cloud"]
      secretName: octodemo-tls
  rules:
    - host: portal.octodemo.cloud
      http:
        paths:
          - path: /(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ghpages-obs
                port: { number: 443 }
